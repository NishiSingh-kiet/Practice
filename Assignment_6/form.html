<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <script src="script.js"></script> -->
</head>
<body>
    <form id="myForm">
        <h1>University Registration</h1>
    <label>Name:</label>
    <input type="text" id="name" placeholder="Enter your name"><br><br>
    <label>Email:</label>
    <input type="email" id="email" placeholder="Enter your email"><br><br>
    <label>Age:</label>
    <input type="number" id="age" placeholder="Enter your age"><br><br>
    <label name="gender">Gender:</label>
    <label for="male">Male</label>
    <input type="radio" id="male">
    <label for="female">Female</label>
    <input type="radio" id="female"><br><br>
    <label>Course:</label>
    <select name="mode">
        <option>Select Courses</option>
        <option>MCA</option>
        <option>BCA</option>
        <option>BBA</option>
    </select><br><br>
    <label>Study Mode:</label>
    <input type="radio" id="regular">
    <label for="regular">Regular</label>
    <input type="radio" id="distance">
    <label for="distance">Distance</label><br><br>
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password"><br><br>
    <label>Confirm password</label>
    <input type="password" id="confirm_password" placeholder="Re enter your password"><br><br>
    <input type="checkbox" id="terms">
    <label for="terms">I accept the Terms and Conditions.</label><br><br>
    <button type="submit">Submit</button>
   </form>
    <script src="script.js"></script>
</body>
</html>
